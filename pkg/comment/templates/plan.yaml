template: plan
version: 2
description: RPI plan phase — lightweight approved intent with verifiable phases and optional in-document status ledgers
doc:
  check_citations: true
  style:
    max_sentence_words: 30
    max_paragraph_words: 70
  max_words: 1000
sections:
  - heading: "Overview"
    required: true
    max_words: 100
    review_criteria:
      - "Can a reviewer tell from the Overview alone what will exist when this plan is done?"
  - heading: "Current State"
    required: true
    max_words: 120
    review_criteria:
      - "Does every claim about existing code carry a file:line citation the reviewer can peek (f), written as a path from the repo root rather than a bare basename?"
  - heading: "Desired End State"
    required: true
    max_words: 80
    zone: human
    review_criteria:
      - "Is the end state stated with how to verify it, not just what it is?"
  - heading: "What We're NOT Doing"
    required: true
    max_words: 100
    zone: human
    review_criteria:
      - "Is the scope fence concrete enough to settle a mid-implementation 'should we also...' without a meeting?"
  - heading: "Implementation Phases"
    required: true
    min_subsections: 2
    max_subsections: 5
    max_subsection_words: 140
    max_words: 450
    review_criteria:
      - "Does each phase open with what changes, in one sentence an implementer could act on? A phase at its word cap is hiding decisions in prose — rewrite it, do not trim a different phase to make room."
      - "Does every phase carry Success Criteria split automated (a command or test) vs manual (human judgment)?"
      - "Is each phase independently verifiable before the next begins?"
      - "For long-running work, does each phase use an H4 Status list whose dated entries contain Summary, Evidence, and Next? Status history has separate caps and does not consume the plan word budget."
      - "Is the plan free of real code? Plans decide and point (file:line); code belongs to implementation."
  - heading: "Risks"
    required: false
    max_words: 100
    review_criteria:
      - "Are only genuine risks listed, each mitigated or explicitly accepted?"
markers:
  needs_clarification: "[NEEDS CLARIFICATION:"
  max: 1
