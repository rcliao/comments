template: design-doc
version: 1
description: Design one-pager optimized for human review — Intent, Decisions, Data Flow, Data Model, Interfaces, Done; bounded length, forced alternatives, explicit unknowns
doc:
  check_citations: true
  style:
    max_sentence_words: 30
    max_paragraph_words: 70
  # The data model is the exception to one-pager discipline: it is the section
  # engineers review hardest, and it is reviewed by PASTING the DBML block into
  # a visualizer — which only renders relationships between tables that are IN
  # the block. So the model carries the full picture (changed entities plus the
  # adjacent unchanged ones they reference), and the doc cap makes room for it.
  # A doc with no data model is unaffected; per-section caps hold the rest.
  max_words: 2800
sections:
  - heading: "Problem"
    required: true
    max_words: 300
    zone: human
    review_criteria:
      - "Is the problem stated without embedding a solution?"
      - "Is it clear who is affected and how much it matters?"
  - heading: "Goals / Non-Goals"
    required: true
    max_words: 200
    zone: human
    review_criteria:
      - "Are non-goals explicit enough to prevent scope creep?"
  - heading: "Proposed Design"
    required: true
    max_words: 800
    review_criteria:
      - "Can a reviewer trace every goal to a part of the design?"
      - "Where structure or flow matters, would an ASCII diagram say it better than prose? Include one if so."
  # Optional: a design that changes no sequence needs no story, and an invented
  # one is worse than none. The actors of the story ARE the component list —
  # a separate Components section exists only for casts too large to hold in
  # the head. Optional sections are exempt from order checking.
  #
  # Criteria are one-line checks; the reasoning behind them lives here:
  # actor/action/work-object keeps it a story, not a component list; actors
  # are the things that ACT, not files, and a role name that is not greppable
  # must say so; a story starts at what defines the behaviour and ends at what
  # the reader receives; NEW/CHANGED marking is what separates a proposal from
  # a description of the present; concurrency is usually the argument for the
  # design; a story and a diagram of the same sequence are two tellings.
  - heading: "Data Flow"
    required: false
    max_words: 600
    review_criteria:
      - "Is every step one actor / action / work-object sentence, marked NEW, CHANGED or unchanged?"
      - "Are actors the things that ACT (a prober, a judge, a store) — with a note wherever the role name is not greppable in the code?"
      - "Does the story run from what defines the behaviour to what the reader receives, no work object appearing from nowhere — and does every step that crosses a system boundary name the interface it calls (detailed under Interfaces)?"
      - "Are concurrent steps distinguished from sequential — and is the flow told ONCE (a diagram must add names, files or concurrency, never repeat the narrative)?"
  # Optional: only when Data Flow's cast is too large to hold in the head.
  - heading: "Components"
    required: false
    max_words: 150
    review_criteria:
      - "One line per component: the Data Flow actor's name and its home (package or file) — nothing a reader could not derive from the story, just faster."
  # Optional: many designs change no data. When one does, this is the most
  # reviewed section in the doc — reviewers paste the block into a DBML
  # visualizer, so it must be the FULL PICTURE (a fragment cannot render
  # relationships to tables outside the block) with the delta marked inside it.
  - heading: "Data Model"
    required: false
    max_words: 900
    review_criteria:
      - "One DBML block, one field per line, valid enough to paste whole into a visualizer — never a wide markdown table?"
      - "Full picture with the delta MARKED: changed entities plus the adjacent unchanged ones they reference, each entity/field tagged NEW / CHANGED / REMOVED or left unmarked as unchanged — plus what must keep being read for compatibility?"
      - "Does every entity state its identity (what you look it up by) and where it lives — with Ref lines distinguishing enforced from convention?"
      - "Are entities that SHOULD exist but do not shown commented out, since an absence is invisible?"
  # The review triad this template encodes: Data Flow says who VERBS whom —
  # and a verb across a system boundary IS an interface usage. Interfaces are
  # those verbs' contracts. Each system's data model is the gravity behind it
  # once data is stored. Review order: the model shows what is extra; the
  # interfaces show how the models link between systems. So every interface
  # here traces back to the flow step that uses it, and forward to the
  # entities it reads or writes.
  - heading: "Interfaces"
    required: false
    max_words: 300
    review_criteria:
      - "Is each interface a compact contract — name (route, command, or signature), input fields WITH their constraints, output shape, and the error/limit cases — enough that a caller could write the call without reading code?"
      - "Does each interface name the Data Flow step(s) that use it, and the data-model entities it reads or writes — so flow, contract, and model link in both directions?"
      - "Marked NEW / CHANGED / REMOVED, with changed contracts showing before -> after?"
  - heading: "Options Considered"
    required: true
    min_subsections: 2
    review_criteria:
      - "Is a simpler alternative listed and explicitly rejected with a reason?"
      - "Does each option (including rejected ones) list explicit pros AND cons as bullets, not prose?"
  - heading: "Risks"
    required: true
    max_words: 200
    review_criteria:
      - "Are only genuine risks listed (no boilerplate), each mitigated or explicitly accepted?"
  - heading: "Definition of Done"
    required: true
    max_words: 200
    zone: human
    review_criteria:
      - "Is every done-criterion objectively verifiable (a command to run, a test that passes, an observable behavior) rather than vague ('works well', 'is clean')?"
      - "Is each criterion labeled automated (a command or test verifies it) or manual (human judgment) — and is the manual list short?"
      - "Would meeting all criteria actually satisfy the stated goals — and is anything a goal implies missing from the list?"
      - "Is it clear what is explicitly OUT of this handoff (deferred to a later phase), so done isn't argued at review time?"
  - heading: "Unresolved Questions"
    required: true
    zone: human
    review_criteria:
      - "Is each question marked blocking (must be decided before approval) or non-blocking (can be settled during implementation)?"
      - "Is each question a SHAPE or TRADE-OFF call — which alternative, what the data model commits us to, what is hard to reverse — not an implementation detail the agent should decide itself?"
markers:
  needs_clarification: "[NEEDS CLARIFICATION:"
  max: 3
