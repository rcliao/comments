template: design-doc
version: 1
description: Design/tech-design doc optimized for human review (bounded length, forced alternatives, explicit unknowns)
doc:
  # 2000 was right when every section was required. With Data Flow and Data Model
  # available, a design carrying both a sequence and a schema cannot fit: the
  # required sections alone run to ~1200 words, and the two optional ones are
  # capped at 700 and 900. A doc using neither is unaffected — the per-section
  # caps, not this one, are what hold a design to a reviewable size.
  #
  # Raised twice, and the second raise is the informative one: reviewers asked for
  # the COMPLETE data model rather than a delta plus a cross-reference, because a
  # schema is scanned for lookup, not read linearly. A complete model of a real
  # system runs 600-900 words on its own. If that makes a doc feel long, the fix is
  # a smaller design, not a shorter schema.
  max_words: 2800
sections:
  - heading: "Problem"
    required: true
    max_words: 300
    zone: human
    review_criteria:
      - "Is the problem stated without embedding a solution?"
      - "Is it clear who is affected and how much it matters?"
  - heading: "Goals / Non-Goals"
    required: true
    max_words: 200
    zone: human
    review_criteria:
      - "Are non-goals explicit enough to prevent scope creep?"
  - heading: "Proposed Design"
    required: true
    max_words: 800
    review_criteria:
      - "Can a reviewer trace every goal to a part of the design?"
      - "Where structure or flow matters, would an ASCII diagram say it better than prose? Include one if so."
  # Optional: a design that changes no sequence needs no story, and an invented
  # one is worse than none. Placed before Data Model on the same reasoning a
  # reviewer gave for it: what MOVES through the system comes before the
  # catalogue of what the things are. Optional sections are exempt from order
  # checking, so a doc may place it wherever it reads best.
  - heading: "Data Flow"
    required: false
    max_words: 700
    review_criteria:
      - "Is every step one sentence in actor / action / work-object form, so it reads as a story rather than a component list?"
      - "Are the actors named as the things that ACT (a prober, a judge, a store) rather than as files or layers — and is it said where a role name will NOT be greppable in the code?"
      - "Does the story start at whatever DEFINES the behaviour (the config, the request, the schedule) and end at what the reader actually receives — with no step where a work object appears from nowhere?"
      - "Is each step marked NEW, CHANGED or unchanged against today? A proposed flow that does not say what moves is indistinguishable from a description of the present."
      - "Is the flow told ONCE? A story and a diagram of the same sequence are two tellings — the diagram must add what prose cannot (names, files, concurrency), not repeat the narrative."
      - "Are the concurrent steps distinguished from the sequential ones, since that is what the timing — and usually the argument for the design — actually depends on?"

  # Optional: many designs change no data at all, and an empty schema section is
  # worse than none.
  - heading: "Data Model"
    required: false
    max_words: 900
    review_criteria:
      - "Is the model written in a schema notation — DBML-style `Table` blocks or equivalent — that stays readable in RAW markdown source? A wide markdown table is hard to read unrendered and collapses every change into a one-line diff; prefer one field per line."
      - "Is every entity's identity stated — the thing you look it up by — even when there is no database and it is an object key, a cache key, or nothing at all?"
      - "Are relationships written as explicit references, distinguishing those the code enforces from those that are conventions nothing checks?"
      - "Does each entity say where it LIVES (in memory, in a row, in an object, in a cache) and which step of the design creates it?"
      - "For a change to existing data: is it clear what is ADDED, what is REMOVED, and what must keep being read for compatibility?"
      - "Are entities that SHOULD exist but do not shown as such — a commented-out block beats an absence, which is invisible?"
  - heading: "Options Considered"
    required: true
    min_subsections: 2
    review_criteria:
      - "Is a simpler alternative listed and explicitly rejected with a reason?"
      - "Does each option (including rejected ones) list explicit pros AND cons as bullets, not prose?"
  - heading: "Risks"
    required: true
    max_words: 200
    review_criteria:
      - "Are only genuine risks listed (no boilerplate), each mitigated or explicitly accepted?"
  - heading: "Definition of Done"
    required: true
    max_words: 200
    zone: human
    review_criteria:
      - "Is every done-criterion objectively verifiable (a command to run, a test that passes, an observable behavior) rather than vague ('works well', 'is clean')?"
      - "Is each criterion labeled automated (a command or test verifies it) or manual (human judgment) — and is the manual list short?"
      - "Would meeting all criteria actually satisfy the stated goals — and is anything a goal implies missing from the list?"
      - "Is it clear what is explicitly OUT of this handoff (deferred to a later phase), so done isn't argued at review time?"
  - heading: "Unresolved Questions"
    required: true
    zone: human
    review_criteria:
      - "Is each question marked blocking (must be decided before approval) or non-blocking (can be settled during implementation)?"
markers:
  needs_clarification: "[NEEDS CLARIFICATION:"
  max: 3
