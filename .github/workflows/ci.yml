name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt failures:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Review-flow smoke test
        run: |
          set -e
          # Build a fresh root binary for the smoke test. Root-binary staleness
          # was a real bug in local dev: an outdated ./comments masqueraded as
          # missing features. Always rebuild before exercising the CLI.
          go build -o comments ./cmd/comments
          printf '# Doc\n\n## Problem\n\nIt is slow.\n\n## Goals / Non-Goals\n\nFaster. Non-goal: rewrite.\n\n## Proposed Design\n\nCache.\n\n## Options Considered\n\n### Option 1: Cache (recommended)\n\nGood.\n\n### Option 2: Rewrite\n\nBig.\n\n## Risks\n\nStaleness: accepted.\n\n## Unresolved Questions\n\nNone.\n' > /tmp/ci-doc.md
          ./comments validate /tmp/ci-doc.md --template design-doc
          ./comments seed /tmp/ci-doc.md --template design-doc
          # gate must fail (exit 10) while seeded blocking threads are open
          if ./comments gate /tmp/ci-doc.md; then echo "gate should have failed"; exit 1; fi
          for id in $(./comments list /tmp/ci-doc.md --format json 2>/dev/null | jq -r '.[].id'); do
            ./comments resolve /tmp/ci-doc.md --thread "$id"
          done
          ./comments signoff /tmp/ci-doc.md --author ci
          # gate must now pass
          ./comments gate /tmp/ci-doc.md

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
