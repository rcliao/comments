name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt failures:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Review-flow smoke test
        run: |
          set -e
          # Build a fresh root binary for the smoke test. Root-binary staleness
          # was a real bug in local dev: an outdated ./comments masqueraded as
          # missing features. Always rebuild before exercising the CLI.
          go build -o comments ./cmd/comments
          printf '# Doc\n\n## Problem\n\nIt is slow.\n\n## Goals / Non-Goals\n\nFaster. Non-goal: rewrite.\n\n## Proposed Design\n\nCache.\n\n## Options Considered\n\n### Option 1: Cache (recommended)\n\nGood.\n\n### Option 2: Rewrite\n\nBig.\n\n## Risks\n\nStaleness: accepted.\n\n## Definition of Done\n\nCache hit rate measured above 90 percent in the smoke benchmark.\n\n## Unresolved Questions\n\nNone.\n' > /tmp/ci-doc.md
          ./comments validate /tmp/ci-doc.md --template design-doc
          ./comments seed /tmp/ci-doc.md --template design-doc
          # gate must fail (exit 10) while seeded blocking threads are open
          if ./comments gate /tmp/ci-doc.md; then echo "gate should have failed"; exit 1; fi

          # zone:human guard: with no TTY and no override the CLI is treated as
          # an agent, so a thread seeded into a human-decision section (design-doc
          # marks Problem as zone: human) must be refused.
          human_id=$(./comments list /tmp/ci-doc.md --format json 2>/dev/null \
            | jq -r '[.[] | select(.section_path | test("Problem"))][0].id')
          if [ -z "$human_id" ] || [ "$human_id" = "null" ]; then
            echo "smoke test could not find a human-zone thread"; exit 1
          fi
          if ./comments resolve /tmp/ci-doc.md --thread "$human_id" >/dev/null 2>&1; then
            echo "zone:human guard failed to refuse an agent resolve"; exit 1
          fi

          # CI stands in for the human reviewer here, which is what the override
          # exists for; agents must not set it.
          export COMMENTS_ACTOR=human
          for id in $(./comments list /tmp/ci-doc.md --format json 2>/dev/null | jq -r '.[].id'); do
            ./comments resolve /tmp/ci-doc.md --thread "$id"
          done
          ./comments signoff /tmp/ci-doc.md --author ci
          # gate must now pass
          ./comments gate /tmp/ci-doc.md

          # doctor must report a sound install (warnings are allowed, failures are not).
          # Scans the checked-out repo, whose docs/ carry real sidecars.
          ./comments doctor . --json
          ./comments doctor .

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
